server:
  port: 8080
  servlet:
    session:
      timeout: 30m
spring:
  application:
    name: mediconnect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mediconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:mediconnect}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
app:
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:5173}
  admin-setup-token: ${ADMIN_SETUP_TOKEN:}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:}
  email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}
