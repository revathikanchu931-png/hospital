spring:
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
app:
  mail-from: ${MAIL_FROM:no-reply@mediconnect.local}
  # Local development convenience only. Production keeps verification enabled.
  email-verification-required: false
logging:
  level:
    com.mediconnect: DEBUG
